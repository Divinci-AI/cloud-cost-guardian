name = "cloudflare-billing-kill-switch"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Check usage every 6 hours. Adjust as needed:
#   "*/5 * * * *"   = every 5 minutes (aggressive)
#   "0 * * * *"     = every hour
#   "0 */6 * * *"   = every 6 hours (default)
#   "0 0 * * *"     = once daily
[triggers]
# 6h: full CF usage/billing kill-switch.  5m: lightweight API uptime self-check.
crons = ["0 */6 * * *", "*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
# External uptime self-check target (the Guardian API's DB-aware health endpoint).
GUARDIAN_HEALTH_URL = "https://api.kill-switch.net/health"

# ── Thresholds ───────────────────────────────────────────────────────────────
# Alerts fire when ANY worker exceeds these thresholds in a single day.
# Set based on your normal usage patterns. Start conservative, tune over time.

# Durable Object requests per day (default: 1 million)
# Context: DO requests cost $0.15/million. 1B requests = $150.
DO_REQUEST_THRESHOLD = "1000000"

# Durable Object wall-time per day in hours (default: 100 hours)
# Context: DO duration costs $12.50/million GB-seconds. Long-running
# WebSocket DOs or Containers can accumulate wall-time quickly.
DO_WALLTIME_HOURS_THRESHOLD = "100"

# Worker requests per day (default: 10 million)
# Context: Catches feedback loops (Worker -> Queue -> Worker) that can
# generate millions of requests in minutes. Standard Workers cost
# $0.30/million after 10M free.
WORKER_REQUEST_THRESHOLD = "10000000"

# R2 operations per day (default: 10 million)
# Context: R2 Class A ops cost $4.50/million, Class B $0.36/million
R2_OPS_THRESHOLD = "10000000"

# R2 total storage in GB (default: 10 GB)
# Context: R2 storage costs $0.015/GB/month
R2_STORAGE_GB_THRESHOLD = "10"

# D1 rows read per day (default: 5 million)
# Context: D1 bills per row scanned, not per result — full table scans are expensive
D1_ROWS_READ_THRESHOLD = "5000000"

# D1 rows written per day (default: 1 million)
D1_ROWS_WRITTEN_THRESHOLD = "1000000"

# Queue operations per day (default: 1 million)
# Context: Each 64KB message chunk counts as one operation
QUEUE_OPS_THRESHOLD = "1000000"

# Stream minutes stored/delivered per day (default: 10,000)
# Context: Stream costs $5.00/1000 min stored, $1.00/1000 min delivered
STREAM_MINUTES_THRESHOLD = "10000"

# ── LLM / AI cost coverage (detect-and-alert only) ────────────────────────────
# These are the scariest 2026 runaways and are invisible to the CF Workers bill.

# Workers AI Neurons per day (default: 500,000 ≈ $5.50/day @ $0.011/1k Neurons).
# No CF API throttles Workers AI per-model — mitigation is in-app (drop the
# model from the caller's fallback chain).
AI_NEURONS_THRESHOLD = "500000"

# AI Gateway UPSTREAM provider $ per day (OpenAI/Anthropic/Gemini/Vertex routed
# through AI Gateway). Default $10/day. (The workers-ai provider's cost is $0
# here — it bills via Neurons above, so it's skipped to avoid double-counting.)
AI_GATEWAY_COST_THRESHOLD = "10"

# Vectorize queried dimensions per day (default: 100M ≈ $1/day @ $0.01/1M dims).
VECTORIZE_DIMENSIONS_THRESHOLD = "100000000"

# ── Kill Switch Behavior ─────────────────────────────────────────────────────

# Auto-disconnect routes when thresholds exceeded (RECOMMENDED)
# Removes zone routes + custom domains and disables the workers.dev subdomain.
# Reversible — worker code stays intact, just stops receiving traffic.
AUTO_DISCONNECT = "true"

# Separate the ALERT threshold from the KILL threshold. Alerts fire at 1× the
# thresholds above; auto-disconnect/delete only fire above N× (default 10×).
# Prevents a cheap-but-busy service (e.g. a 1.5M-req/day voice-agent DO costing
# ~$0.23/day) from being auto-killed off a low alert floor. Set to "1" to
# restore the old behavior where alert == kill.
DISCONNECT_THRESHOLD_MULTIPLIER = "10"

# De-dup window for webhook alerts (Discord/Slack/custom), in seconds.
# Daily-cumulative thresholds stay crossed once breached, so without this the
# same alert re-fires every cron tick (~288×/day on a 5-min cron). PagerDuty is
# exempt (it self-dedups). Requires the ALERT_STATE KV binding below. Default 6h.
ALERT_COOLDOWN_SECONDS = "21600"

# Auto-delete workers when thresholds exceeded (NUCLEAR — use with caution)
# Permanently deletes the worker script and all associated Durable Objects.
# NOT reversible. Only enable if you'd rather lose code than money.
AUTO_DELETE = "false"

# Workers that should NEVER be killed, even if they exceed thresholds.
# Comma-separated list of worker script names.
# Always include this kill switch worker itself!
PROTECTED_WORKERS = "cloudflare-billing-kill-switch,divinci-agent-stage,divinci-agent-production"

# R2 buckets, D1 databases, and queues that should NEVER be killed.
# Comma-separated list of resource names.
PROTECTED_RESOURCES = ""

# ── Alert de-dup / kill-snapshot state ────────────────────────────────────────
# KV namespace for alert cooldown (de-dup) and forensic kill snapshots.
# Create it once:  wrangler kv namespace create ALERT_STATE
# then paste the returned id below. Optional but RECOMMENDED — without it,
# webhook alerts cannot be deduped and will re-fire every cron tick.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "70af5e6edb8b414ab96f6bbb0618b4be"

# ── Secrets ──────────────────────────────────────────────────────────────────
# REQUIRED (set via `wrangler secret put <NAME>`):
#   CLOUDFLARE_API_TOKEN    — API token with permissions:
#                             - Account > Account Analytics: Read   (monitoring; without this the CF half reads EMPTY and you're silently blind)
#                             - Account > Workers Scripts: Edit      (auto-disconnect: subdomain + custom domains; auto-delete)
#                             - Zone > Workers Routes: Edit          (auto-disconnect: zone [[routes]] removal)
#                             - Zone > Zone: Read                    (enumerate zones to find routes to remove)
#   CLOUDFLARE_ACCOUNT_ID   — Your Cloudflare account ID
#
#   ADMIN_SECRET            — Bearer token gating /check, /usage, /test-alert.
#                             Endpoints FAIL CLOSED (refuse) if this is unset.
#                             Set via: wrangler secret put ADMIN_SECRET
#
# ALERTING (at least one recommended):
#   PAGERDUTY_ROUTING_KEY   — PagerDuty Events API v2 integration key
#                             (pages on-call until acknowledged)
#   DISCORD_WEBHOOK_URL     — Discord channel webhook URL
#   SLACK_WEBHOOK_URL       — Slack incoming webhook URL
#   CUSTOM_WEBHOOK_URL      — Any HTTP endpoint that accepts POST JSON
#
# Secrets Store bindings (account-level, shared with Zombay)
[[secrets_store_secrets]]
binding = "PAGERDUTY_ROUTING_KEY"
store_id = "0b7ac993cf26413ea6e2f1b5ede20b25"
secret_name = "PAGERDUTY_ROUTING_KEY"

# NOTE: For new deployments, consider migrating secrets to the Cloudflare
# Secrets Store (store_id: 0b7ac993cf26413ea6e2f1b5ede20b25) for centralized
# management. Bind via [[secrets_store_secrets]] in wrangler.toml.
