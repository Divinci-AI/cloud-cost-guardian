name = "kill-switch-app"
compatibility_date = "2024-09-23"
main = "src/worker.ts"

# Serve built React SPA from ./dist
[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
# Run the Worker on EVERY request (not just SPA-fallback routes). Without this,
# Cloudflare serves matched assets (/, /index.html, JS/CSS) directly and bypasses
# the Worker — so its security headers + CSP never reached the actual app entry.
run_worker_first = true

# Custom domain
[[routes]]
pattern = "app.kill-switch.net"
custom_domain = true
