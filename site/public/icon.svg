<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1b2a55"/>
      <stop offset="60%" stop-color="#0c1229"/>
      <stop offset="100%" stop-color="#080d20"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="55%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e0453f"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5ce2e7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="0" fill="url(#bg)"/>
  <circle cx="200" cy="186" r="150" fill="#ff6b6b" opacity="0.06" filter="url(#soft)"/>

  <!-- emergency-stop ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#ring)" stroke-width="30"/>

  <!-- power / kill glyph: broken ring (gap at top) + vertical bar -->
  <g stroke="url(#glyph)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M 230 143.5 A 64 64 0 1 1 170 143.5"/>
    <line x1="200" y1="128" x2="200" y2="204"/>
  </g>
</svg>
