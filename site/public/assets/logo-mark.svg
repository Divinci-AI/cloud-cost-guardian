<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kill Switch">
  <defs>
    <linearGradient id="ksRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="55%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e0453f"/>
    </linearGradient>
    <linearGradient id="ksGlyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5ce2e7"/>
    </linearGradient>
  </defs>

  <!-- emergency-stop ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#ksRing)" stroke-width="30"/>

  <!-- power / kill glyph: broken ring (gap at top) + vertical bar -->
  <g stroke="url(#ksGlyph)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M 230 143.5 A 64 64 0 1 1 170 143.5"/>
    <line x1="200" y1="128" x2="200" y2="204"/>
  </g>
</svg>
